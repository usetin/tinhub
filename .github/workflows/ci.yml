name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check out the tin toolchain
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: usetin/tin
          path: tin
          persist-credentials: false
      - name: Check out tit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: usetin/tit
          path: tit
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: tests/fakes/s3sig/go.mod
          cache: false
      - name: Build the compiler from the checked-in seed
        run: make -C tin bin/tinc
      - name: tinhub tests
        run: TIN_ROOT="$PWD/tin" TIT_ROOT="$PWD/tit" sh tests/run.sh "$PWD/tin/bin/tinc"

  postgres:
    name: Postgres (Linux x86-64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tinhub_test
          POSTGRES_USER: tin
          POSTGRES_PASSWORD: tinpass
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tin -d tinhub_test" --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check out the tin toolchain
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: usetin/tin
          path: tin
          persist-credentials: false
      - name: Check out tit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: usetin/tit
          path: tit
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: tests/fakes/s3sig/go.mod
          cache: false
      - name: Build the compiler from the checked-in seed
        run: make -C tin bin/tinc
      - name: MinIO (a real S3 server for the pack store checks)
        run: |
          # dl.min.io answers 410 for the server binary and quay.io refuses anonymous pulls: MinIO built from a pinned
          # source version through the Go module proxy, which keeps every published version
          GOBIN="$RUNNER_TEMP/minio-bin" go install github.com/minio/minio@v0.0.0-20260212201848-7aac2a2c5b7c
          mkdir -p "$RUNNER_TEMP/minio-data"
          MINIO_ROOT_USER=tinminio MINIO_ROOT_PASSWORD=tinminiosecret nohup "$RUNNER_TEMP/minio-bin/minio" server "$RUNNER_TEMP/minio-data" --address 127.0.0.1:9000 --quiet > "$RUNNER_TEMP/minio.log" 2>&1 &
          for i in $(seq 1 60); do curl -fs -o /dev/null http://127.0.0.1:9000/minio/health/live && break; sleep 1; done
      - name: tinhub tests against the runner's PostgreSQL
        env:
          TINHUB_TEST_DB: 127.0.0.1:5432/tinhub_test
          TINHUB_TEST_DB_USER: tin
          TINHUB_TEST_DB_PASSWORD: tinpass
          TINHUB_TEST_MINIO: http://127.0.0.1:9000
          TINHUB_TEST_MINIO_KEY: tinminio
          TINHUB_TEST_MINIO_SECRET: tinminiosecret
        run: TIN_ROOT="$PWD/tin" TIT_ROOT="$PWD/tit" sh tests/run.sh "$PWD/tin/bin/tinc"
